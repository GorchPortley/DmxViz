name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
          - name: windows-msvc
            os: windows-2022
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl-dev libx11-dev libxi-dev libxcursor-dev xvfb mesa-utils

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ matrix.name }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DDMXVIZ_WARNINGS_AS_ERRORS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DDMXVIZ_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: bash
        run: cmake --build build --config RelWithDebInfo --parallel 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Error summary
        if: failure()
        shell: bash
        run: |
          echo "==== unique compiler errors/warnings (first 60) ===="
          grep -E "(error|warning) C[0-9]+:|error:|warning:" build.log | sed -E 's/ \[[^]]*\]$//' | sort -u | head -60 || true

      - name: Unit tests
        timeout-minutes: 5
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure --timeout 240

      - name: Test failure summary
        if: failure()
        shell: bash
        run: |
          exe=$(find build/tests -name 'dmxviz_tests*' -type f \( -name '*.exe' -o -perm -u+x \) | head -1)
          echo "==== failing checks ===="
          timeout 240 "$exe" --no-intro 2>&1 | grep -E -A7 "ERROR:|FATAL ERROR" | grep -vE "^\[ *[0-9.]+\] " | head -150 || true

      - name: Simulation benchmark (informational)
        if: runner.os == 'Linux'
        shell: bash
        # CPU time and heap allocations per frame for the 500 fixture / 1200 beam / 64 universe reference rig
        # (NFR-1). Shared runners are noisy, so this never fails on the numbers, only if the tool crashes.
        run: |
          ./build/tools/sim_bench/sim_bench --frames 300 | tee sim_bench.txt
          { echo '### Simulation benchmark'; echo '```'; cat sim_bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test (headless screenshot)
        if: runner.os == 'Linux'
        run: |
          mkdir -p screenshots
          xvfb-run -a -s "-screen 0 1600x900x24" ./build/src/app/dmxviz --screenshot screenshots/app.png
          if [ -x build/tools/render_sandbox/render_sandbox ]; then
            xvfb-run -a -s "-screen 0 1600x900x24" ./build/tools/render_sandbox/render_sandbox --screenshot screenshots/sandbox.png
          fi

      - name: Upload screenshots
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

  # Unit tests (including tests/robustness: mutated inputs, limits, thread stress tests) built with
  # sanitizers. Tests only: DMXVIZ_BUILD_APP=OFF needs no display. Local equivalent:
  #   cmake -S . -B build-asan -G Ninja -DDMXVIZ_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Debug \
  #     -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
  #     -DCMAKE_C_FLAGS="-fsanitize=address,undefined" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
  linux-sanitizers:
    name: linux-sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl-dev libx11-dev libxi-dev libxcursor-dev

      # Sanitizer runtimes break with the high ASLR entropy of recent runner kernels.
      - name: Lower ASLR entropy
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build-asan/_deps
          key: deps-linux-asan-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: >
          cmake -S . -B build-asan -G Ninja -DDMXVIZ_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Unit tests (ASan + UBSan)
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          DMXVIZ_SLOW_TESTS: "1"
        run: ctest --test-dir build-asan --output-on-failure --timeout 1200

  # Data races between the DMX IO threads, the output thread and the main thread
  # (tests/robustness/test_dmx_threading.cpp). DMXVIZ_STRESS_SCALE lengthens the stress tests.
  linux-tsan:
    name: linux-tsan (ThreadSanitizer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl-dev libx11-dev libxi-dev libxcursor-dev

      - name: Lower ASLR entropy
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build-tsan/_deps
          key: deps-linux-tsan-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: >
          cmake -S . -B build-tsan -G Ninja -DDMXVIZ_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread"
          -DCMAKE_C_FLAGS="-fsanitize=thread"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build-tsan --parallel

      - name: Unit tests (ThreadSanitizer)
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
          DMXVIZ_STRESS_SCALE: "3"
        run: ctest --test-dir build-tsan --output-on-failure --timeout 1200
